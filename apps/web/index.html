<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Primary Meta Tags -->
  <title>Trắc Nghiệm Kinh Thánh – Câu Đố Kinh Thánh Online — BibleQuiz</title>
  <meta name="description" content="Nen tang hoc Kinh Thanh qua gamification — trac nghiem, thi dau multiplayer, nhom hoi thanh, xep hang theo mua. Hoan toan mien phi." />
  <meta name="keywords" content="quiz kinh thanh, trac nghiem kinh thanh, cau do kinh thanh, trac nghiem kinh thanh tin lanh, cau do kinh thanh tin lanh, do kinh thanh online, hoc kinh thanh online, bible quiz tieng viet, thi dua kinh thanh nhom hoi thanh" />
  <meta name="author" content="BibleQuiz" />
  <meta name="theme-color" content="#EFE3C3" />

  <!--
    Canonical is set per-page via react-helmet-async (PageMeta) — no static
    <link rel="canonical"> here, or it would conflict with the per-page tag.
    No hreflang link annotations: the app serves both vi + en at the SAME URL
    (i18next language-detector, no per-locale URL routing). hreflang REQUIRES
    distinct per-language URLs, so emitting them would point crawlers at 404s.
    Re-add hreflang once locale-prefixed routes (/en, /vi) exist.
  -->

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Trắc Nghiệm Kinh Thánh – Câu Đố Kinh Thánh Online — BibleQuiz" />
  <meta property="og:description" content="Nen tang hoc Kinh Thanh qua gamification — trac nghiem, thi dau multiplayer, nhom hoi thanh, xep hang theo mua." />
  <meta property="og:image" content="https://forbible.org/og-image.png" />
  <meta property="og:url" content="https://forbible.org" />
  <meta property="og:site_name" content="BibleQuiz" />
  <meta property="og:locale" content="vi_VN" />
  <meta property="og:locale:alternate" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Trắc Nghiệm Kinh Thánh – Câu Đố Kinh Thánh Online — BibleQuiz" />
  <meta name="twitter:description" content="Nen tang hoc Kinh Thanh qua gamification — trac nghiem, thi dau multiplayer, nhom hoi thanh." />
  <meta name="twitter:image" content="https://forbible.org/og-image.png" />

  <!-- Favicon — SVG brass lantern (matches the header logo) is primary;
       .ico is the legacy fallback. Regenerate the PNG/ICO set from the SVG with
       `node apps/web/scripts/gen-favicons.mjs`. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Performance Hints -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://be.forbible.org" />

  <!-- Hero is an inline SVG (HeroIllustration) — no hero image to preload -->


  <!-- Fonts — non-blocking with media swap.
       Sheets ship media="print" + data-font-swap; /load-fonts.js flips them to
       media="all" once parsed (CSP-safe; no inline onload → no unsafe-inline). -->
  <script src="/load-fonts.js" defer></script>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" media="print" data-font-swap />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" /></noscript>

  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" media="print" data-font-swap />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" /></noscript>

  <!-- Cormorant Garamond italic — used ONLY for verse text + drop cap (HR-1) -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600;1,700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600;1,700&display=swap" media="print" data-font-swap />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600;1,700&display=swap" /></noscript>

  <!-- "Lữ Khách" UI font — Baloo 2 (LKD-1); Literata kept for legacy verse styles -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,600;1,7..72,500;1,7..72,600&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,600;1,7..72,500;1,7..72,600&display=swap" media="print" data-font-swap />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,600;1,7..72,500;1,7..72,600&display=swap" /></noscript>

  <script type="application/ld+json">

      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "BibleQuiz",
      "description": "Trò chơi trắc nghiệm Kinh Thánh: 5 câu thử thách mỗi ngày, luyện theo sách hoặc theo câu chuyện, đấu hạng và học cùng nhóm hội thánh",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web, Android",
      "inLanguage": ["vi", "en"],
      "offers": {
        "@type": "Offer",

      },

        "name": "BibleQuiz"
      }
    }

  <!-- Organization + WebSite graph (linked via @id) for richer entity results -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://forbible.org/#organization",
          "name": "BibleQuiz",
          "url": "https://forbible.org",
          "logo": "https://forbible.org/android-chrome-512x512.png"
        },
        {
          "@type": "WebSite",
          "@id": "https://forbible.org/#website",
          "name": "BibleQuiz",
          "url": "https://forbible.org",
          "inLanguage": ["vi", "en"],
          "publisher": { "@id": "https://forbible.org/#organization" }
        }
      ]
    }
  </script>
</head>
